services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wallex-opportunity-agent
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONPATH=/app/src
      - DASHBOARD_BIND=0.0.0.0
      - DASHBOARD_PORT=8000
      - SQLITE_DB_PATH=/app/data/wallex_agent.db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - wallex_data:/app/data
      - wallex_logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  wallex_data:
    name: wallex_agent_data
  wallex_logs:
    name: wallex_agent_logs
